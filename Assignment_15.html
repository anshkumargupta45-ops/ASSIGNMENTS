<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment-15</title>
</head>
<body>
    <form action="#">
        <fieldset>
        <legend>Personal Details</legend>
        <label for="Name">Name : </label>
        <input type="text" name="Name" id="Name" placeholder="Enter your name" required>
        <br><br>
        <label for="email">Email : </label>
        <input type="email" name="email" id="email" placeholder="Enter your email">
        <br><br>
        <label for="password">Password :</label>
        <input type="password" name="password" id="password" placeholder="Enter your password">
        <br><br>
        <label for="gender">Gender : </label>
        <input type="radio" name="gender" id="male" value="male"><label for="male">Male</label>
        <input type="radio" name="gender" id="female" value="female"><label for="female">Female</label>
        <br><br>
        <label for="hobby">Hobbies : </label>
        <input type="checkbox" name="hobby 1" id="hobby 1" value="Reading"><label for="hobby 1">Reading</label>
        <input type="checkbox" name="hobby 2" id="hobby 2" value="Coding"><label for="hobby 2">Coding</label>
        <br><br>
        <label for="dob">DOB : </label>
        <input type="date" name="dob" id="dob">
        </fieldset>

    </form>
    
</body>
</html>
